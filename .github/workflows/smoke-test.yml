name: CircuitVision live model smoke test
on:
  push:
    branches: [main, integration/sam-specialist-existing-website-20261020]
    paths: ['.github/workflows/smoke-test.yml', 'backend/**', 'models/**', 'app.js', 'styles.css', 'notebooks/**', 'requirements.txt', 'project_status.json', 'tests/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require project progress review for feature changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
          echo "Changed files:"; printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(app\.js|api\.js|motion_tracker\.mjs|component_details\.mjs|styles\.css|backend/|models/|notebooks/)'; then
            printf '%s\n' "$changed" | grep -Fxq 'project_status.json' || { echo 'Update project_status.json alongside feature changes: no silently stale website.' >&2; exit 1; }
          fi
      - name: Validate single YOLO11 public workflow and safe automatic fusion
        run: |
          python -m unittest discover -s tests -p test_round3_side_by_side.py -v
          python -m unittest discover -s tests -p test_smart_fusion.py -v
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const app=fs.readFileSync('app.js','utf8');
          const back=fs.readFileSync('backend/main.py','utf8');
          const api=fs.readFileSync('api.js','utf8');
          if(!app.includes("model:'auto'"))throw Error('Unified YOLO11 is not the default');
          if(!app.includes('CircuitVision YOLO11 · Automatic Detection'))throw Error('No unified YOLO11 user label');
          if(app.includes('<select id="camera-model"') || app.includes('<select id="model"'))throw Error('Exposed internal model selector');
          if(app.includes('data-action="compare-models"'))throw Error('Exposed obsolete model comparison UI');
          if(!api.includes("form.append('live', String(isLive))"))throw Error('Live camera hint missing');
          if(!back.includes("if model == 'auto':") || !back.includes("if live:"))throw Error('Low-latency auto strategy missing');
          if(!back.includes('refine_with_sam(combined, specialist)'))throw Error('Sam specialist not integrated in the original API');
          if(!back.includes("auto_fuse(primary, extra"))throw Error('Missing conservative new-class still-image expansion');
          console.log('One public YOLO11 model: fast camera, cautious expanded still image detection');
          JS
      - name: Validate specialist API, YOLO merge and camera low-latency behavior
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/test_specialist_fusion.py tests/test_auto_specialist_integration.py tests/test_still_precision.py tests/test_project_status.py
      - name: Test transient upload connection recovery
        run: node tests/test_api_transport.mjs
      - name: Validate Sam ZIP audit notebook
        run: python tests/test_sam_data_audit_notebook.py
      - name: Validate unified three-stage training notebook
        run: python tests/test_unified_three_stage_notebook.py
      - name: Check browser JavaScript syntax
        run: node --check app.js && node --check api.js && node --check demo.js && node --check motion_tracker.mjs && node --check component_details.mjs
      - name: Confirm browser tracker module served by FastAPI
        run: |
          python - <<'PY'
          import ast, pathlib
          module=ast.parse(pathlib.Path('backend/main.py').read_text())
          assign=next(n for n in module.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='FRONTEND_FILES' for t in n.targets))
          files=ast.literal_eval(assign.value)
          assert 'motion_tracker.mjs' in files, 'FastAPI must serve browser tracker module'
          assert 'component_details.mjs' in files, 'FastAPI must serve component guide module'
          assert pathlib.Path('motion_tracker.mjs').exists(), 'Tracker module absent'
          assert pathlib.Path('component_details.mjs').exists(), 'Guide module absent'
          assert "text/javascript" in pathlib.Path('backend/main.py').read_text()
          print('FastAPI includes tracker module with JavaScript MIME type')
          PY
      - name: Test component reference and resistor color value calculator
        run: node tests/test_component_details.mjs
      - name: Test browser motion tracking and delayed YOLO replay
        run: node tests/test_motion_tracker.mjs && node tests/test_motion_tracker_quality.mjs
      - name: Verify factual website copy and mobile screen safeguards
        run: node tests/test_ui_copy_mobile.mjs
      - name: Check component guide available from detection results
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const a=fs.readFileSync('app.js','utf8');
          for(const s of ["state.page==='guide'?componentGuide()","data-action=\"component-detail\"","id=\"resistor-band-count\"","resistorBands5","decodeResistorBands(bands)"]){
            if(!a.includes(s))throw Error('Guide not connected: '+s);
          }
          console.log('Component details reachable from live and still-image results');
          JS
      - name: Check small-part live camera defaults
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const app=fs.readFileSync('app.js','utf8');
          const cfg=fs.readFileSync('config.js','utf8');
          for (const test of ['confidence:35','live-zoom','state.settings.zoom','motion tracking','liveFrameUrl']) {
            if (!app.includes(test)) throw new Error('Missing camera quality/sync setting: '+test);
          }
          if (!cfg.includes('liveFrameWidth: 640') || !cfg.includes('liveFrameIntervalMs: 80')) {
            throw new Error('Low-latency camera settings missing');
          }
          console.log('Camera quality, user zoom, threshold and sync controls verified');
          JS
      - name: Check motion tracking integrated with live detector
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const app=fs.readFileSync('app.js','utf8');
          for(const phrase of [
            "from './motion_tracker.mjs'",
            "captureTrackingFrame(canvas,performance.now())",
            "liveTracker.ingestDetections(result.detections,trackingAnchor,performance.now())",
            "state.liveDetections=liveTracker.getDetections()",
            "liveTracker.reset()",
            "video.style.transform=state.settings.zoom===2?'scale(2)':'scale(1)'"
          ])if(!app.includes(phrase))throw Error('Tracker wiring missing: '+phrase);
          console.log('YOLO result anchors, motion replay and zoom geometry connected');
          JS
      - name: Check portrait camera frame alignment regression
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const required=[
            'overlay.classList.toggle(\'has-frame\',false)',
            'state.liveFrameSize={width:canvas.width,height:canvas.height}',
            'state.liveFrameSize.width',
            'state.liveFrameSize.height',
            "zoom===(Number(state.settings.zoom)===2?2:1)",
          ];
          for(const item of required)if(!app.includes(item))throw new Error('Missing synced camera geometry: '+item);
          if(!css.includes('.live-overlay,.live-overlay.has-frame{background:transparent!important}'))throw new Error('Smooth preview regression: overlay hides camera');
          if(!app.includes("const frozenFrame=''"))throw new Error('Smooth preview regression: stale inference snapshot rendered');
          // Portrait video 480x640 in 800x500 container must have horizontal letterbox:
          const W=800,H=500,fw=480,fh=640,s=Math.min(W/fw,H/fh),dx=(W-fw*s)/2;
          if(!(dx>0&&Math.abs(dx-212.5)<0.01))throw new Error('Portrait letterbox regression');
          console.log('Frame, boxes and portrait letterboxing stay registered');
          JS
      - name: Validate CircuitVision training notebooks
        run: |
          python - <<'PY'
          import ast, json, pathlib
          for p in pathlib.Path('notebooks').glob('*.ipynb'):
              nb=json.loads(p.read_text())
              assert nb['nbformat']==4
              for i,cell in enumerate(nb['cells']):
                  if cell['cell_type']!='code': continue
                  source=''.join(cell['source'])
                  cleaned='\n'.join(line for line in source.splitlines() if not line.startswith('%pip'))
                  try:
                      ast.parse(cleaned)
                  except SyntaxError as e:
                      raise SyntaxError(f'{p} cell {i}: {e}') from e
              print('Validated notebook:',p)
          PY
      - name: Check pinned training archives and fallback
        run: |
          python -m unittest discover -s tests -p test_project_checkpoint.py -v
          python -m unittest discover -s tests -p test_round2_checkpoint.py -v
      - name: Test real deployed detector
        env:
          BASE_URL: https://circuitvision-yolo-lab.onrender.com
        run: |
          python3 - <<'PY'
          import json,os,struct,time,urllib.request,zlib
          base=os.environ['BASE_URL']
          student_zip_present = os.path.isfile('models/CircuitVision_Trained_Model.zip')
          round2_zip_present = os.path.isfile('models/CircuitVision_Accuracy_Round2.zip')
          target_model = 'best.onnx' if (student_zip_present or round2_zip_present) else 'eesob.onnx'
          target_classes = 57 if (student_zip_present or round2_zip_present) else 48
          target_version = ('circuitvision-accuracy-round2-57-yolo11n' if round2_zip_present
                            else 'circuitvision-combined-57-yolo11n' if student_zip_present else None)
          health=None
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=120) as res:
                      health=json.load(res)
                  print('Health:',health,flush=True)
                  if (health.get('custom_model_available') and
                      health.get('model_file')==target_model and
                      health.get('class_count')==target_classes and
                      health.get('model_version')==target_version):
                      break
              except Exception as exc:
                  print('Attempt',attempt+1,str(exc),flush=True)
              time.sleep(25)
          assert health and health.get('custom_model_available') is True, 'Detector failed to load'
          assert len(health.get('deployment_commit', '')) == 12, 'New CircuitVision release is not deployed'
          assert health.get('still_image_tiling') is True, 'High-resolution upload enhancement is not deployed'
          assert health.get('model_file') == target_model, 'Unexpected model source'
          assert health.get('class_count') == target_classes, 'Unexpected model class count'
          assert health.get('model_version') == target_version, 'Unexpected deployed model version'
          width,height=160,160
          def chunk(kind,data):
              return struct.pack('!I',len(data))+kind+data+struct.pack('!I',zlib.crc32(kind+data)&0xffffffff)
          pixels=b''.join(b'\x00'+bytes((120,85,140))*width for _ in range(height))
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!IIBBBBB',width,height,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(pixels))+chunk(b'IEND',b'')
          boundary='circuitvision-smoke-2026'
          form=(b'--'+boundary.encode()+b'\r\nContent-Disposition: form-data; name="confidence"\r\n\r\n0.50\r\n'+
                b'--'+boundary.encode()+b'\r\nContent-Disposition: form-data; name="image"; filename="sample.png"\r\nContent-Type: image/png\r\n\r\n'+
                png+b'\r\n--'+boundary.encode()+b'--\r\n')
          req=urllib.request.Request(base+'/api/detect',data=form,method='POST',headers={'Content-Type':'multipart/form-data; boundary='+boundary})
          with urllib.request.urlopen(req,timeout=120) as res:
              prediction=json.load(res)
          assert isinstance(prediction.get('detections'),list), 'Invalid detection API response'
          assert prediction.get('image_width')==160, 'Wrong image dimensions'
          print('Real ONNX inference succeeded:',json.dumps({
              'model_file': target_model, 'class_count': target_classes,
              'model':prediction.get('model'),
              'processing_ms':prediction.get('processing_ms'),
              'detections_count':len(prediction['detections'])
          }))
          # Exercise the new single public YOLO11 model contract, both paths.
          def send_auto(live_mode):
              fields=(b'--'+boundary.encode()+
                  b'\r\nContent-Disposition: form-data; name="model"\r\n\r\nauto\r\n')
              fields+=(b'--'+boundary.encode()+
                  b'\r\nContent-Disposition: form-data; name="live"\r\n\r\n'+
                  (b'true' if live_mode else b'false')+b'\r\n')
              request=urllib.request.Request(base+'/api/detect',data=fields+form,
                  method='POST',headers={'Content-Type':'multipart/form-data; boundary='+boundary})
              with urllib.request.urlopen(request,timeout=150) as res:
                  data=json.load(res)
              assert data.get('model')=='CircuitVision YOLO11',data
              assert isinstance(data.get('detections'),list)
              assert data.get('inference_strategy')==('low_latency_core' if live_mode else 'core_with_optional_round3_and_sam')
              print('Unified YOLO11', 'live' if live_mode else 'photo',
                    'inference succeeded:',data.get('processing_ms'),'ms',flush=True)
          send_auto(True)
          send_auto(False)
          PY

      - name: Test both live model routes on the same image
        env:
          BASE_URL: https://circuitvision-yolo-lab.onrender.com
        run: |
          python3 - <<'PY'
          import json,os,struct,zlib,urllib.request,urllib.error,time
          base=os.environ['BASE_URL']
          health=None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=40) as response:
                      health=json.load(response)
                  if health.get('experimental_round3_available') and health.get('class_count')==57:
                      break
              except Exception as exc:
                  print('Health check pending',type(exc).__name__,str(exc),flush=True)
              time.sleep(10)
          assert health is not None, 'No reachable CircuitVision backend'
          assert health.get('custom_model_available'), 'Round 2 not loaded'
          assert health.get('experimental_round3_available'), 'Round 3 experimental model missing'
          assert health.get('experimental_round3_class_count')==81, 'Round 3 must expose 81 classes'
          def chunk(kind,payload):
              return struct.pack('!I',len(payload))+kind+payload+struct.pack('!I',zlib.crc32(kind+payload)&0xffffffff)
          width,height=96,96
          raw=b''.join(b'\x00'+b''.join(bytes(((x*3+y)%256,(x*2+y*4)%256,(x*5+y*3)%256)) for x in range(width)) for y in range(height))
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!IIBBBBB',width,height,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          boundary='circuitvision-comparison-smoke'
          def payload_for(model):
              fields=(b'--'+boundary.encode()+b'\r\nContent-Disposition: form-data; name="model"\r\n\r\n'+model.encode()+b'\r\n'+
                      b'--'+boundary.encode()+b'\r\nContent-Disposition: form-data; name="confidence"\r\n\r\n0.35\r\n'+
                      b'--'+boundary.encode()+b'\r\nContent-Disposition: form-data; name="image"; filename="same.png"\r\nContent-Type: image/png\r\n\r\n'+png+
                      b'\r\n--'+boundary.encode()+b'--\r\n')
              return fields
          for model in ('custom','round3'):
              req=urllib.request.Request(base+'/api/detect',method='POST',data=payload_for(model),
                                         headers={'Content-Type':'multipart/form-data; boundary='+boundary})
              with urllib.request.urlopen(req,timeout=120) as response:
                  result=json.load(response)
              assert result.get('model')==model, f'Wrong model route for {model}: {result}'
              assert result.get('image_width')==width and result.get('image_height')==height
              assert isinstance(result.get('detections'),list)
              print('LIVE INFERENCE OK:',model, 'processing_ms=',result.get('processing_ms'),
                    'detections=',len(result['detections']),flush=True)
          print('Side-by-side Round 2 / Round 3 API smoke test PASSED')
          PY
